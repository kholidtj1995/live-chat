<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23000'/%3E%3Cpath d='M36 16v22a7 7 0 11-6-6.9V25a13 13 0 006 1.6V21a7 7 0 000-.1V16z' fill='%2325F4EE'/%3E%3Cpath d='M34.5 16v22a7 7 0 11-6-6.9V25a13 13 0 006 1.6V21a7 7 0 000-.1V16z' fill='%23FE2C55'/%3E%3Cpath d='M35.2 16v22a7 7 0 11-6-6.9V25a13 13 0 006 1.6V21a7 7 0 000-.1V16z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;
    background:#000;
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    color:#f1f1f1;
    padding:24px;
    overflow:hidden;
  }
  .card{
    background:#111;
    border-radius:16px;
    padding:40px 32px;
    max-width:340px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    border:1px solid #222;
  }
  .icon{width:64px;height:64px;margin:0 auto 20px;display:block}
  h1{font-size:20px;margin:0 0 8px;font-weight:600}
  p{color:#999;font-size:14px;line-height:1.5;margin:0 0 28px}
  a.btn{
    display:inline-block;background:#fff;color:#000;font-weight:700;
    text-decoration:none;padding:12px 28px;border-radius:999px;font-size:15px;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="32" fill="#000"/>
      <path d="M38 16v20.5a6.5 6.5 0 1 1-5.5-6.4v-5.2a11.7 11.7 0 0 0 5.5 1.4V21a6.3 6.3 0 0 1-3.6-5z" fill="#25F4EE" transform="translate(-1.2,-0.7)"/>
      <path d="M38 16v20.5a6.5 6.5 0 1 1-5.5-6.4v-5.2a11.7 11.7 0 0 0 5.5 1.4V21a6.3 6.3 0 0 1-3.6-5z" fill="#FE2C55" transform="translate(1.2,0.7)"/>
      <path d="M38 16v20.5a6.5 6.5 0 1 1-5.5-6.4v-5.2a11.7 11.7 0 0 0 5.5 1.4V21a6.3 6.3 0 0 1-3.6-5z" fill="#fff"/>
    </svg>
    <h1>TikTok</h1>
    <p>Кушода истодааст TikTok…</p>
    <a class="btn" href="https://www.tiktok.com/" target="_blank" rel="noopener">Кушодан</a>
  </div>
  <script>setTimeout(function(){window.location.href="https://www.tiktok.com/";},400);</script>
</body>
</html>
