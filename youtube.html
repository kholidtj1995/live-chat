<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23FF0033'/%3E%3Cpath d='M26 24l16 8-16 8z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;
    background:#0f0f0f;
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    color:#f1f1f1;
    padding:24px;
    overflow:hidden;
  }
  .card{
    background:#181818;
    border-radius:16px;
    padding:40px 32px;
    max-width:340px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .icon{width:64px;height:64px;margin:0 auto 20px;display:block}
  h1{font-size:20px;margin:0 0 8px;font-weight:600}
  p{color:#aaa;font-size:14px;line-height:1.5;margin:0 0 28px}
  a.btn{
    display:inline-block;background:#FF0033;color:#fff;font-weight:600;
    text-decoration:none;padding:12px 28px;border-radius:999px;font-size:15px;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="32" fill="#FF0033"/>
      <path d="M26 24l16 8-16 8z" fill="#fff"/>
    </svg>
    <h1>YouTube</h1>
    <p>Кушода истодааст YouTube…</p>
    <a class="btn" href="https://www.youtube.com/" target="_blank" rel="noopener">Кушодан</a>
  </div>
  <script>setTimeout(function(){window.location.href="https://www.youtube.com/";},400);</script>
</body>
</html>
