<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23fff'/%3E%3Cpath d='M32 26v6.4h9.1c-.4 2.3-2.7 6.8-9.1 6.8-5.5 0-10-4.5-10-10.2s4.5-10.2 10-10.2c3.1 0 5.2 1.3 6.4 2.5l4.4-4.3C40 13.6 36.4 12 32 12c-11 0-20 9-20 20s9 20 20 20c11.5 0 19.2-8.1 19.2-19.5 0-1.3-.1-2.3-.3-3.3H32z' fill='%234285F4'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;
    background:#f1f3f4;
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    color:#202124;
    padding:24px;
    overflow:hidden;
  }
  .card{
    background:#fff;
    border-radius:16px;
    padding:40px 32px;
    max-width:340px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.12);
    border:1px solid #e8eaed;
  }
  .icon{width:64px;height:64px;margin:0 auto 20px;display:block}
  h1{font-size:20px;margin:0 0 8px;font-weight:600}
  p{color:#5f6368;font-size:14px;line-height:1.5;margin:0 0 28px}
  a.btn{
    display:inline-block;background:#4285F4;color:#fff;font-weight:600;
    text-decoration:none;padding:12px 28px;border-radius:999px;font-size:15px;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="32" fill="#fff" stroke="#e8eaed" stroke-width="1"/>
      <path d="M32 26v6.4h9.1c-.4 2.3-2.7 6.8-9.1 6.8-5.5 0-10-4.5-10-10.2s4.5-10.2 10-10.2c3.1 0 5.2 1.3 6.4 2.5l4.4-4.3C40 13.6 36.4 12 32 12c-11 0-20 9-20 20s9 20 20 20c11.5 0 19.2-8.1 19.2-19.5 0-1.3-.1-2.3-.3-3.3H32z" fill="#4285F4"/>
    </svg>
    <h1>Google</h1>
    <p>Кушода истодааст Google…</p>
    <a class="btn" href="https://www.google.com/" target="_blank" rel="noopener">Кушодан</a>
  </div>
  <script>setTimeout(function(){window.location.href="https://www.google.com/";},400);</script>
</body>
</html>
