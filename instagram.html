<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='ig' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%23FEDA75'/%3E%3Cstop offset='.35' stop-color='%23FA7E1E'/%3E%3Cstop offset='.6' stop-color='%23D62976'/%3E%3Cstop offset='.8' stop-color='%23962FBF'/%3E%3Cstop offset='1' stop-color='%234F5BD5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='56' height='56' rx='18' fill='url(%23ig)'/%3E%3Ccircle cx='32' cy='32' r='11' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Ccircle cx='45' cy='19' r='3' fill='%23fff'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;
    background:#fafafa;
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    color:#262626;
    padding:24px;
    overflow:hidden;
  }
  .card{
    background:#fff;
    border-radius:16px;
    padding:40px 32px;
    max-width:340px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.15);
    border:1px solid #eee;
  }
  .icon{width:64px;height:64px;margin:0 auto 20px;display:block}
  h1{font-size:20px;margin:0 0 8px;font-weight:600}
  p{color:#8e8e8e;font-size:14px;line-height:1.5;margin:0 0 28px}
  a.btn{
    display:inline-block;background:linear-gradient(135deg,#FEDA75,#FA7E1E,#D62976,#962FBF,#4F5BD5);
    color:#fff;font-weight:600;text-decoration:none;padding:12px 28px;border-radius:999px;font-size:15px;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ig2" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#FEDA75"/>
          <stop offset=".35" stop-color="#FA7E1E"/>
          <stop offset=".6" stop-color="#D62976"/>
          <stop offset=".8" stop-color="#962FBF"/>
          <stop offset="1" stop-color="#4F5BD5"/>
        </linearGradient>
      </defs>
      <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#ig2)"/>
      <circle cx="32" cy="32" r="11" fill="none" stroke="#fff" stroke-width="4"/>
      <circle cx="45" cy="19" r="3" fill="#fff"/>
    </svg>
    <h1>Instagram</h1>
    <p>Кушода истодааст Instagram…</p>
    <a class="btn" href="https://www.instagram.com/" target="_blank" rel="noopener">Кушодан</a>
  </div>
  <script>setTimeout(function(){window.location.href="https://www.instagram.com/";},400);</script>
</body>
</html>
